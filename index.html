<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecosol Maps</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1>Ecosol Maps</h1>
        <div class="controls">
          <label for="map-select">Mapa:</label>
          <select id="map-select"></select>
        </div>
      </header>
      <main class="main">
        <div class="map-frame">
          <div id="map"></div>
          <aside id="legend" class="legend"></aside>
          <div id="info" class="info"></div>
          <aside id="details-panel" class="details-panel" aria-hidden="true">
            <header class="details-header">
              <h2 id="details-title">Detalhes</h2>
              <button type="button" id="details-close" class="details-close" aria-label="Fechar">
                &times;
              </button>
            </header>
            <div id="details-content" class="details-content"></div>
          </aside>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
